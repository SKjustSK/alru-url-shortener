version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: alru-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: alru_url_shortener_db
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alru_url_shortener_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: alru-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alru-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      PORT: 1323
      FRONTEND_URL: http://localhost:80
      BACKEND_URL: http://localhost:1323
      JWT_SECRET: supersecretjwtkey123
      HASHID_SALT: supersecrethashidsalt
      IP_HASH_SALT: supersecretiphashidsalt
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password123
      DB_NAME: alru_url_shortener_db
      DB_SSL: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
    ports:
      - "1323:1323"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:1323
    container_name: alru-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
